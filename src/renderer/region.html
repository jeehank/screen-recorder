<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Selector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #2d3748;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 12px 36px rgba(45, 55, 72, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      z-index: 1000;
    }
    .hud-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2d3748;
      font-weight: 700;
    }
    .hud-logo {
      width: 20px;
      height: 20px;
      background: #ff5240;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .hud-logo svg {
      width: 12px;
      height: 12px;
    }
    .hud-divider {
      width: 1px;
      height: 16px;
      background: #e2e8f0;
    }
    .hud-instructions {
      color: #718096;
      font-size: 12px;
    }
    .hud-controls {
      display: flex;
      gap: 8px;
    }
    .hud-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #4a5568;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .hud-btn:hover {
      background: #ffffff;
      border-color: #94a3b8;
    }
    .hud-btn.confirm {
      background: #ff5240;
      border-color: #ff5240;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(255, 82, 64, 0.35);
    }
    .hud-btn.confirm:hover {
      background: #fa4430;
      box-shadow: 0 4px 12px rgba(255, 82, 64, 0.45);
    }
    .hud-btn.cancel {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #64748b;
    }
    .hud-btn.cancel:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #ef4444;
    }
    .dimension-badge {
      position: absolute;
      background: #ffffff;
      color: #ff5240;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 700;
      pointer-events: none;
      display: none;
      border: 1.5px solid #ff5240;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      z-index: 500;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">
      <div class="hud-logo">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="2" y="4" width="14" height="16" rx="3" fill="#ffffff"/>
          <polygon points="16 9.5 21 6.5 21 17.5 16 14.5" fill="#ffffff"/>
        </svg>
      </div>
      <span>Select Area</span>
    </div>
    <div class="hud-divider"></div>
    <span class="hud-instructions">Drag to select screen area</span>
    <div class="hud-controls">
      <button id="btn-full" class="hud-btn">Full Screen</button>
      <button id="btn-1080p" class="hud-btn">1080p</button>
      <button id="btn-720p" class="hud-btn">720p</button>
      <button id="btn-confirm" class="hud-btn confirm">Confirm (Enter)</button>
      <button id="btn-cancel" class="hud-btn cancel">Cancel (Esc)</button>
    </div>
  </div>

  <div id="dimension-badge" class="dimension-badge">0 x 0</div>

  <div id="canvas-container">
    <canvas id="overlay-canvas"></canvas>
  </div>

  <script src="js/region-overlay.js"></script>
</body>
</html>
